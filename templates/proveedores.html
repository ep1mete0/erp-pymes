<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRESHMART — Proveedores</title>
<style>
/* ============================================================
   BASE — misma paleta que el módulo de Ventas
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Courier New', monospace; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ============================================================
   HEADER
   ============================================================ */
#top-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; background: #16213e;
  border-bottom: 2px solid #0f3460; flex-shrink: 0;
}
#top-bar h1 { font-size: 15px; color: #e94560; letter-spacing: 2px; font-weight: 700; }
#top-clock  { font-size: 13px; color: #a0a0b0; }
#top-user   { font-size: 12px; color: #4fc3f7; }

/* ============================================================
   LAYOUT — dos columnas (lista proveedores | panel detalle)
   ============================================================ */
#main-layout {
  display: grid; grid-template-columns: 1fr 420px;
  flex: 1; overflow: hidden;
}

/* ============================================================
   PANEL IZQUIERDO — lista de proveedores
   ============================================================ */
#left-panel {
  display: flex; flex-direction: column; border-right: 2px solid #0f3460; overflow: hidden;
}

/* Toolbar izquierdo */
#left-toolbar {
  display: flex; gap: 8px; padding: 10px 12px;
  background: #0d0d1a; border-bottom: 1px solid #0f3460; flex-shrink: 0; flex-wrap: wrap;
}
#search-prov {
  flex: 1; min-width: 180px; padding: 8px 12px;
  background: #16213e; border: 2px solid #0f3460;
  border-radius: 8px; color: #4fc3f7;
  font-family: 'Courier New', monospace; font-size: 13px; outline: none;
}
#search-prov:focus { border-color: #e94560; }
#search-prov::placeholder { color: #3a3a5c; }

.toolbar-btn {
  padding: 8px 14px; border: none; border-radius: 8px;
  font-size: 11px; font-weight: 700; cursor: pointer;
  letter-spacing: 1px; font-family: 'Courier New', monospace;
}
.btn-primary { background: #e94560; color: white; }
.btn-primary:hover { background: #c73652; }
.btn-outline {
  background: none; color: #4fc3f7;
  border: 1px solid #0f3460; color: #a0b0c0;
}
.btn-outline:hover { border-color: #4fc3f7; color: #4fc3f7; }

/* KPIs proveedores */
#prov-kpis {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 6px; padding: 8px 12px; flex-shrink: 0;
}
.kpi-sm {
  background: #16213e; border: 1px solid #0f3460;
  border-radius: 8px; padding: 8px 10px;
}
.kpi-sm .kpi-lbl { font-size: 9px; color: #5a6a7a; letter-spacing: 1px; }
.kpi-sm .kpi-v   { font-size: 16px; font-weight: 700; color: #4fc3f7; }

/* Lista de tarjetas de proveedores */
#prov-list {
  flex: 1; overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px;
}
#prov-list::-webkit-scrollbar { width: 4px; }
#prov-list::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 4px; }

.prov-card {
  background: #16213e; border: 1px solid #0f3460;
  border-radius: 10px; padding: 12px 14px; cursor: pointer; transition: all 0.15s;
}
.prov-card:hover, .prov-card.active { border-color: #4fc3f7; background: #1a2a4a; }
.prov-card.active { border-left: 3px solid #4fc3f7; }
.pc-top {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;
}
.pc-name  { font-size: 13px; font-weight: 700; color: #e0e8f0; }
.pc-rut   { font-size: 10px; color: #5a6a7a; }
.pc-cat-badge {
  font-size: 9px; padding: 2px 7px; border-radius: 8px;
  background: #0a1628; color: #4fc3f7; border: 1px solid #0f3460;
}
.pc-row {
  display: flex; gap: 16px; flex-wrap: wrap;
}
.pc-stat { }
.pc-stat .lbl { font-size: 9px; color: #5a6a7a; }
.pc-stat .val { font-size: 11px; color: #c0d0e0; }
.pc-stat .val.green { color: #43d882; }
.pc-stat .val.amber { color: #ffb74d; }
.pc-stat .val.red   { color: #e94560; }

/* ============================================================
   PANEL DERECHO — detalle del proveedor + órdenes
   ============================================================ */
#right-panel {
  display: flex; flex-direction: column; background: #0d0d1a; overflow: hidden;
}

#detail-header {
  padding: 12px 16px; background: #16213e;
  border-bottom: 1px solid #0f3460; flex-shrink: 0;
  display: flex; justify-content: space-between; align-items: flex-start;
}
#detail-header h2 { font-size: 13px; color: #4fc3f7; letter-spacing: 1px; }
#detail-header p  { font-size: 11px; color: #5a6a7a; margin-top: 3px; }

/* Tabs panel derecho */
#detail-tabs {
  display: flex; border-bottom: 1px solid #0f3460; flex-shrink: 0;
}
.det-tab {
  padding: 8px 16px; font-size: 11px; color: #5a6a7a;
  cursor: pointer; border-bottom: 2px solid transparent;
  letter-spacing: 1px; transition: all 0.15s;
}
.det-tab:hover { color: #a0b0c0; }
.det-tab.active { color: #4fc3f7; border-bottom-color: #4fc3f7; }

/* Contenido tabs */
#detail-body { flex: 1; overflow-y: auto; padding: 12px 16px; }
#detail-body::-webkit-scrollbar { width: 4px; }
#detail-body::-webkit-scrollbar-thumb { background: #0f3460; }

/* Ficha info proveedor */
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.info-field { background: #16213e; border-radius: 6px; padding: 8px 10px; }
.info-field .lbl { font-size: 9px; color: #5a6a7a; letter-spacing: 1px; margin-bottom: 3px; }
.info-field .val { font-size: 12px; color: #c0d0e0; }
.info-field.full { grid-column: 1 / -1; }

/* Tabla de órdenes de compra */
.orders-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.orders-table th {
  text-align: left; padding: 6px 8px; color: #5a6a7a;
  font-size: 9px; letter-spacing: 1px; border-bottom: 1px solid #0f3460;
}
.orders-table td {
  padding: 7px 8px; border-bottom: 1px solid #0f3460;
  color: #c0d0e0; vertical-align: top;
}
.orders-table tr:hover td { background: #1a2540; }
.order-badge {
  display: inline-block; padding: 1px 6px; border-radius: 6px;
  font-size: 9px; font-weight: 700;
}
.ob-pendiente { background: #3a2a0a; color: #ffb74d; border: 1px solid #5a4a1a; }
.ob-recibida  { background: #1a3a2a; color: #43d882; border: 1px solid #2a5a3a; }
.ob-parcial   { background: #0a1628; color: #4fc3f7; border: 1px solid #1a3a5a; }
.ob-cancelada { background: #3a1a1a; color: #e94560; border: 1px solid #5a2a2a; }

/* tabla productos del proveedor */
.prods-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.prods-table th {
  text-align: left; padding: 6px 8px; color: #5a6a7a;
  font-size: 9px; letter-spacing: 1px; border-bottom: 1px solid #0f3460;
}
.prods-table td { padding: 7px 8px; border-bottom: 1px solid #0f3460; color: #c0d0e0; }

/* Panel de nueva orden */
#new-order-footer {
  padding: 10px 16px; border-top: 1px solid #0f3460;
  background: #16213e; flex-shrink: 0;
}

/* ============================================================
   MODAL — nuevo proveedor / nueva orden
   ============================================================ */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 200;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: #16213e; border: 1px solid #0f3460;
  border-radius: 12px; padding: 24px; width: 480px; max-width: 95vw;
}
.modal-box h2 { font-size: 13px; color: #4fc3f7; letter-spacing: 1px; margin-bottom: 16px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group.full { grid-column: 1 / -1; }
.form-label { font-size: 9px; color: #5a6a7a; letter-spacing: 1px; }
.form-input {
  padding: 8px 10px; background: #0d0d1a; border: 1px solid #0f3460;
  border-radius: 6px; color: #e0e0e0;
  font-family: 'Courier New', monospace; font-size: 12px; outline: none;
}
.form-input:focus { border-color: #4fc3f7; }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
.modal-btn-cancel {
  padding: 7px 14px; background: none; border: 1px solid #0f3460;
  border-radius: 6px; color: #a0b0c0; cursor: pointer; font-size: 11px;
  font-family: 'Courier New', monospace;
}
.modal-btn-save {
  padding: 7px 18px; background: #e94560; border: none;
  border-radius: 6px; color: white; cursor: pointer;
  font-size: 11px; font-weight: 700; letter-spacing: 1px;
  font-family: 'Courier New', monospace;
}
.modal-btn-save:hover { background: #c73652; }

/* ============================================================
   TOAST
   ============================================================ */
#toast {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  background: #4fc3f7; color: #0d0d1a;
  padding: 8px 20px; border-radius: 20px;
  font-size: 12px; font-weight: 700; display: none; z-index: 300;
}
#toast.error { background: #e94560; color: white; }
#toast.ok    { background: #43d882; color: #0d0d1a; }

.empty-state { color: #3a3a5c; font-size: 12px; text-align: center; padding: 30px 0; }
</style>
</head>

  const map = {
    pendiente: 'ob-pendiente', recibida: 'ob-recibida',
    parcial:   'ob-parcial',   cancelada:'ob-cancelada',
  };
  return `<span class="order-badge ${map[e]||''}">${e.toUpperCase()}</span>`;
}

/* ============================================================
   KPIs
   ============================================================ */
function updateKPIs() {
  document.getElementById('kpi-total').textContent   = providers.length;
  document.getElementById('kpi-activas').textContent = orders.filter(o => o.estado === 'pendiente').length;
  const mes = providers.reduce((a,p) => a + p.comprasMes, 0);
  document.getElementById('kpi-mes').textContent     = fmt(mes);
}

/* ============================================================
   RENDER LISTA
   ============================================================ */
function renderList() {
  const q    = searchQ.toLowerCase();
  const list = providers.filter(p =>
    !q || p.name.toLowerCase().includes(q) || p.rut.includes(q) || p.cat.toLowerCase().includes(q)
  );

  if (!list.length) {
    document.getElementById('prov-list').innerHTML = '<div class="empty-state">Sin resultados</div>';
    return;
  }

  document.getElementById('prov-list').innerHTML = list.map(p => {
    const pendientes = orders.filter(o => o.provId === p.id && o.estado === 'pendiente').length;
    const actColor   = pendientes > 0 ? 'amber' : 'green';
    return `
    <div class="prov-card${currentProvId===p.id?' active':''}" onclick="selectProv('${p.id}')">
      <div class="pc-top">
        <div>
          <div class="pc-name">${p.name}</div>
          <div class="pc-rut">${p.rut}</div>
        </div>
        <div class="pc-cat-badge">${p.cat}</div>
      </div>
      <div class="pc-row">
        <div class="pc-stat">
          <div class="lbl">COMPRAS MES</div>
          <div class="val">${fmt(p.comprasMes)}</div>
        </div>
        <div class="pc-stat">
          <div class="lbl">CONTACTO</div>
          <div class="val">${p.contacto}</div>
        </div>
        <div class="pc-stat">
          <div class="lbl">PLAZO</div>
          <div class="val">${p.plazo}d</div>
        </div>
        <div class="pc-stat">
          <div class="lbl">ÓRDENES PEND.</div>
          <div class="val ${actColor}">${pendientes}</div>
        </div>
      </div>
    </div>`;
  }).join('');

  updateKPIs();
}

/* ============================================================
   SELECCIÓN DE PROVEEDOR
   ============================================================ */
function selectProv(id) {
  currentProvId = id;
  renderList();
  renderDetail();
  document.getElementById('btn-edit-prov').style.display = 'inline-block';
  document.getElementById('btn-new-order').style.display = 'inline-block';
  document.getElementById('new-order-footer').style.display = 'block';
}

function renderDetail() {
  const p = providers.find(x => x.id === currentProvId);
  if (!p) return;
  document.getElementById('det-name').textContent = p.name;
  document.getElementById('det-sub').textContent  = `${p.rut} | ${p.cat} | ${p.freq}`;
  renderTab();
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.det-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.det-tab').forEach(t => {
    if (t.textContent.trim().toLowerCase().startsWith(tab)) t.classList.add('active');
  });
  renderTab();
}

function renderTab() {
  if (!currentProvId) return;
  const p = providers.find(x => x.id === currentProvId);
  const body = document.getElementById('detail-body');

  if (activeTab === 'info') {
    body.innerHTML = `
    <div class="info-grid">
      <div class="info-field"><div class="lbl">CONTACTO</div><div class="val">${p.contacto}</div></div>
      <div class="info-field"><div class="lbl">TELÉFONO</div><div class="val">${p.tel}</div></div>
      <div class="info-field full"><div class="lbl">EMAIL</div><div class="val">${p.email}</div></div>
      <div class="info-field full"><div class="lbl">DIRECCIÓN</div><div class="val">${p.dir}</div></div>
      <div class="info-field"><div class="lbl">PLAZO DE PAGO</div><div class="val">${p.plazo} días</div></div>
      <div class="info-field"><div class="lbl">FRECUENCIA ENTREGA</div><div class="val">${p.freq}</div></div>
      <div class="info-field"><div class="lbl">COMPRAS ESTE MES</div><div class="val" style="color:#4fc3f7">${fmt(p.comprasMes)}</div></div>
      <div class="info-field"><div class="lbl">COMPRAS HISTÓRICAS</div><div class="val" style="color:#43d882">${fmt(p.comprasTotal)}</div></div>
      <div class="info-field full"><div class="lbl">NOTAS / CONDICIONES</div><div class="val" style="color:#a0b0c0;line-height:1.5">${p.notas || '—'}</div></div>
    </div>`;

  } else if (activeTab === 'orders') {
    const povOrders = orders.filter(o => o.provId === p.id);
    if (!povOrders.length) { body.innerHTML = '<div class="empty-state">Sin órdenes registradas</div>'; return; }
    body.innerHTML = `
    <table class="orders-table">
      <thead><tr>
        <th>ORDEN</th><th>PRODUCTO</th><th>QTY</th><th>PRECIO</th><th>TOTAL</th><th>ENTREGA</th><th>ESTADO</th><th>NOTAS</th>
      </tr></thead>
      <tbody>
        ${povOrders.map(o => `
        <tr>
          <td>${o.id}</td>
          <td>${o.prod}</td>
          <td>${o.qty}</td>
          <td>${fmt(o.precio)}</td>
          <td style="color:#4fc3f7">${fmt(o.qty * o.precio)}</td>
          <td>${o.fecha}</td>
          <td>${estadoBadge(o.estado)}</td>
          <td style="color:#5a6a7a;font-size:10px">${o.notas||'—'}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;

  } else if (activeTab === 'products') {
    const prods = provProducts[p.id] || [];
    if (!prods.length) { body.innerHTML = '<div class="empty-state">Sin productos registrados</div>'; return; }
    body.innerHTML = `
    <table class="prods-table">
      <thead><tr>
        <th>PRODUCTO</th><th>PRECIO ACTUAL</th><th>PRECIO ANTERIOR</th><th>VARIACIÓN</th>
      </tr></thead>
      <tbody>
        ${prods.map(pr => {
          const delta   = ((pr.price - pr.prevPrice) / pr.prevPrice * 100).toFixed(1);
          const dColor  = delta > 0 ? '#e94560' : delta < 0 ? '#43d882' : '#5a6a7a';
          const dSign   = delta > 0 ? '▲' : delta < 0 ? '▼' : '—';
          return `
          <tr>
            <td>${pr.name}</td>
            <td style="color:#4fc3f7;font-weight:700">${fmt(pr.price)}</td>
            <td style="color:#5a6a7a">${fmt(pr.prevPrice)}</td>
            <td style="color:${dColor};font-weight:700">${dSign} ${Math.abs(delta)}%</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
  }
}

/* ============================================================
   MODAL PROVEEDOR
   ============================================================ */
function openProvModal(id = null) {
  editingProvId = id;
  const p = id ? providers.find(x => x.id === id) : null;
  document.getElementById('prov-modal-title').textContent = p ? 'EDITAR PROVEEDOR' : 'NUEVO PROVEEDOR';
  document.getElementById('pm-name').value    = p?.name     ?? '';
  document.getElementById('pm-rut').value     = p?.rut      ?? '';
  document.getElementById('pm-cat').value     = p?.cat      ?? 'Lácteos';
  document.getElementById('pm-contacto').value= p?.contacto ?? '';
  document.getElementById('pm-tel').value     = p?.tel      ?? '';
  document.getElementById('pm-email').value   = p?.email    ?? '';
  document.getElementById('pm-plazo').value   = p?.plazo    ?? '';
  document.getElementById('pm-freq').value    = p?.freq     ?? 'Semanal';
  document.getElementById('pm-dir').value     = p?.dir      ?? '';
  document.getElementById('pm-notas').value   = p?.notas    ?? '';
  document.getElementById('prov-modal').classList.add('show');
}

function closeProvModal() { document.getElementById('prov-modal').classList.remove('show'); }

function editCurrentProv() { if (currentProvId) openProvModal(currentProvId); }

function saveProv() {
  const name = document.getElementById('pm-name').value.trim();
  const rut  = document.getElementById('pm-rut').value.trim();
  if (!name || !rut) { showToast('Nombre y RUT son obligatorios', 'error'); return; }

  const data = {
    id:       editingProvId ?? 'P' + String(providers.length + 1).padStart(3, '0'),
    name, rut,
    cat:      document.getElementById('pm-cat').value,
    contacto: document.getElementById('pm-contacto').value,
    tel:      document.getElementById('pm-tel').value,
    email:    document.getElementById('pm-email').value,
    plazo:    parseInt(document.getElementById('pm-plazo').value) || 30,
    freq:     document.getElementById('pm-freq').value,
    dir:      document.getElementById('pm-dir').value,
    notas:    document.getElementById('pm-notas').value,
    comprasMes:   editingProvId ? providers.find(x=>x.id===editingProvId).comprasMes : 0,
    comprasTotal: editingProvId ? providers.find(x=>x.id===editingProvId).comprasTotal : 0,
  };

  if (editingProvId) {
    const idx = providers.findIndex(x => x.id === editingProvId);
    providers[idx] = data;
    showToast('Proveedor actualizado', 'ok');
  } else {
    providers.push(data);
    showToast('Proveedor creado', 'ok');
  }

  closeProvModal();
  renderList();
  if (currentProvId === editingProvId) renderDetail();

  /* TODO: POST/PUT /api/proveedores */
}

/* ============================================================
   MODAL ORDEN
   ============================================================ */
function openOrderModal() {
  /* Populate selects */
  const ps = document.getElementById('om-prov');
  ps.innerHTML = providers.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  if (currentProvId) ps.value = currentProvId;

  /* Fecha por defecto: hoy + 3 días */
  const d = new Date(); d.setDate(d.getDate() + 3);
  document.getElementById('om-fecha').value = d.toISOString().split('T')[0];
  document.getElementById('om-qty').value   = '';
  document.getElementById('om-precio').value= '';
  document.getElementById('om-notas').value = '';

  updateOrderProds();
  document.getElementById('order-modal').classList.add('show');
}

function updateOrderProds() {
  const pid  = document.getElementById('om-prov').value;
  const prods = provProducts[pid] || [];
  const sel   = document.getElementById('om-prod');
  sel.innerHTML = prods.length
    ? prods.map(p => `<option>${p.name}</option>`).join('')
    : '<option>— selecciona un proveedor —</option>';

  /* Auto-llenar precio si existe */
  if (prods.length) {
    const match = prods.find(p => p.name === sel.value);
    if (match) document.getElementById('om-precio').value = match.price;
  }
}

function closeOrderModal() { document.getElementById('order-modal').classList.remove('show'); }

function saveOrder() {
  const qty   = parseInt(document.getElementById('om-qty').value) || 0;
  const precio= parseInt(document.getElementById('om-precio').value) || 0;
  if (qty <= 0 || precio <= 0) { showToast('Cantidad y precio requeridos', 'error'); return; }

  const order = {
    id:     'OC-' + String(orders.length + 1).padStart(3, '0'),
    provId: document.getElementById('om-prov').value,
    prod:   document.getElementById('om-prod').value,
    qty, precio,
    fecha:  document.getElementById('om-fecha').value,
    estado: document.getElementById('om-estado').value,
    notas:  document.getElementById('om-notas').value,
  };

  orders.push(order);
  closeOrderModal();
  renderList();
  if (activeTab === 'orders') renderTab();
  showToast(`Orden ${order.id} creada`, 'ok');
  updateKPIs();

  /* TODO: POST /api/ordenes-compra */
}

/* ============================================================
   TOAST
   ============================================================ */
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = type; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2000);
}

/* ============================================================
   EVENTOS
   ============================================================ */
document.getElementById('search-prov').addEventListener('input', function() {
  searchQ = this.value; renderList();
});
document.getElementById('om-prov').addEventListener('change', updateOrderProds);
document.getElementById('om-prod').addEventListener('change', function() {
  const pid  = document.getElementById('om-prov').value;
  const prods= provProducts[pid] || [];
  const match= prods.find(p => p.name === this.value);
  if (match) document.getElementById('om-precio').value = match.price;
});

/* Reloj */
function updateClock() {
  document.getElementById('top-clock').textContent = new Date().toLocaleTimeString('es-CL');
}

/* ============================================================
   INIT
   ============================================================ */
renderList();
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
