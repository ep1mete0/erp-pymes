<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRESHMART — Inventario</title>
  <style>
    /* ============================================================
   BASE — misma paleta que el módulo de Ventas
   ============================================================ */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Courier New', monospace;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ============================================================
   HEADER GLOBAL
   ============================================================ */
    #top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: #16213e;
      border-bottom: 2px solid #0f3460;
      flex-shrink: 0;
    }

    #top-bar h1 {
      font-size: 15px;
      color: #e94560;
      letter-spacing: 2px;
      font-weight: 700;
    }

    #top-clock {
      font-size: 13px;
      color: #a0a0b0;
    }

    #top-user {
      font-size: 12px;
      color: #4fc3f7;
    }

    /* ============================================================
   BARRA DE HERRAMIENTAS (búsqueda + filtros + botón agregar)
   ============================================================ */
    #toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 10px 16px;
      background: #0d0d1a;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    #search-inv {
      flex: 1;
      min-width: 200px;
      padding: 8px 12px;
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 8px;
      color: #4fc3f7;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      outline: none;
    }

    #search-inv:focus {
      border-color: #e94560;
    }

    #search-inv::placeholder {
      color: #3a3a5c;
    }

    .filter-sel {
      padding: 8px 10px;
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      color: #a0b0c0;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }

    .filter-sel:focus {
      border-color: #4fc3f7;
    }

    #btn-add-prod {
      padding: 8px 16px;
      background: #e94560;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    #btn-add-prod:hover {
      background: #c73652;
    }

    /* ============================================================
   TARJETAS DE KPI (métricas rápidas)
   ============================================================ */
    #kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 10px 16px;
      flex-shrink: 0;
    }

    .kpi-card {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 10px;
      padding: 10px 14px;
    }

    .kpi-label {
      font-size: 10px;
      color: #5a6a7a;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .kpi-val {
      font-size: 20px;
      font-weight: 700;
      color: #4fc3f7;
    }

    .kpi-sub {
      font-size: 10px;
      color: #7a8a9a;
      margin-top: 2px;
    }

    .kpi-card.warn .kpi-val {
      color: #ffb74d;
    }

    .kpi-card.danger .kpi-val {
      color: #e94560;
    }

    .kpi-card.ok .kpi-val {
      color: #43d882;
    }

    /* ============================================================
   TABLA DE INVENTARIO
   ============================================================ */
    #table-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 16px;
    }

    #table-wrap::-webkit-scrollbar {
      width: 4px;
    }

    #table-wrap::-webkit-scrollbar-thumb {
      background: #0f3460;
      border-radius: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    thead th {
      position: sticky;
      top: 0;
      background: #0d0d1a;
      padding: 10px 10px;
      text-align: left;
      color: #5a6a7a;
      letter-spacing: 1px;
      font-size: 10px;
      border-bottom: 1px solid #0f3460;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    thead th:hover {
      color: #4fc3f7;
    }

    thead th .sort-icon {
      margin-left: 4px;
      opacity: 0.4;
    }

    thead th.sorted .sort-icon {
      opacity: 1;
      color: #4fc3f7;
    }

    tbody tr {
      border-bottom: 1px solid #0f3460;
      transition: background 0.12s;
    }

    tbody tr:hover {
      background: #1a2540;
    }

    tbody tr.low-stock {
      border-left: 3px solid #ffb74d;
    }

    tbody tr.critical {
      border-left: 3px solid #e94560;
    }

    tbody tr.expiring {
      border-left: 3px solid #ce93d8;
    }

    td {
      padding: 9px 10px;
      color: #c0d0e0;
      vertical-align: middle;
    }

    /* columnas específicas */
    .td-icon {
      font-size: 18px;
      width: 36px;
      text-align: center;
    }

    .td-name {
      font-weight: 500;
      color: #e0e8f0;
    }

    .td-sub {
      font-size: 10px;
      color: #5a6a7a;
    }

    .td-code {
      color: #3a5a7a;
      font-size: 11px;
    }

    .td-cat {}

    .td-price {
      color: #4fc3f7;
      font-weight: 700;
    }

    .td-cost {
      color: #7a9a7a;
    }

    .td-margin {
      font-weight: 700;
    }

    .td-stock {
      font-weight: 700;
    }

    .td-min {
      color: #5a6a7a;
    }

    .td-expiry {
      font-size: 11px;
    }

    .td-actions {
      white-space: nowrap;
    }

    /* badges de estado */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .badge-ok {
      background: #1a3a2a;
      color: #43d882;
      border: 1px solid #2a5a3a;
    }

    .badge-low {
      background: #3a2a0a;
      color: #ffb74d;
      border: 1px solid #5a4a1a;
    }

    .badge-critical {
      background: #3a1a1a;
      color: #e94560;
      border: 1px solid #5a2a2a;
    }

    .badge-expiring {
      background: #2a1a3a;
      color: #ce93d8;
      border: 1px solid #4a2a5a;
    }

    /* botones de acción en tabla */
    .act-btn {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
      border: 1px solid;
      font-family: 'Courier New', monospace;
      margin-left: 4px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .act-edit {
      color: #4fc3f7;
      border-color: #4fc3f7;
      background: none;
    }

    .act-edit:hover {
      background: #4fc3f7;
      color: #0d0d1a;
    }

    .act-reponer {
      color: #43d882;
      border-color: #43d882;
      background: none;
    }

    .act-reponer:hover {
      background: #43d882;
      color: #0d0d1a;
    }

    .act-del {
      color: #e94560;
      border-color: #e94560;
      background: none;
    }

    .act-del:hover {
      background: #e94560;
      color: white;
    }

    /* ============================================================
   MODAL — agregar / editar producto
   ============================================================ */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    #modal-overlay.show {
      display: flex;
    }

    #modal {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 12px;
      padding: 24px;
      width: 500px;
      max-width: 95vw;
    }

    #modal h2 {
      font-size: 14px;
      color: #4fc3f7;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-label {
      font-size: 10px;
      color: #5a6a7a;
      letter-spacing: 1px;
    }

    .form-input {
      padding: 8px 10px;
      background: #0d0d1a;
      border: 1px solid #0f3460;
      border-radius: 6px;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      outline: none;
    }

    .form-input:focus {
      border-color: #4fc3f7;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      justify-content: flex-end;
    }

    .modal-btn-cancel {
      padding: 8px 16px;
      background: none;
      border: 1px solid #0f3460;
      border-radius: 6px;
      color: #a0b0c0;
      cursor: pointer;
      font-size: 12px;
    }

    .modal-btn-save {
      padding: 8px 20px;
      background: #e94560;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .modal-btn-save:hover {
      background: #c73652;
    }

    /* ============================================================
   MODAL — entrada de stock (reposición)
   ============================================================ */
    #modal-stock-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    #modal-stock-overlay.show {
      display: flex;
    }

    #modal-stock {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 12px;
      padding: 24px;
      width: 360px;
    }

    #modal-stock h2 {
      font-size: 14px;
      color: #43d882;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .stock-product-info {
      background: #0d0d1a;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 14px;
      font-size: 12px;
      color: #a0b0c0;
    }

    .stock-product-info strong {
      color: #e0e0e0;
    }

    /* ============================================================
   TOAST
   ============================================================ */
    #toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: #4fc3f7;
      color: #0d0d1a;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      display: none;
      z-index: 300;
    }

    #toast.error {
      background: #e94560;
      color: white;
    }

    #toast.ok {
      background: #43d882;
      color: #0d0d1a;
    }
  </style>
</head>

<body>

  <!-- ============================================================
     HEADER
     ============================================================ -->
  <div id="top-bar">
    <h1>FRESHMART — INVENTARIO</h1>
    <div style="text-align:right">
      <div id="top-clock"></div>
      <div id="top-user">Admin: María G.</div>
    </div>
  </div>

  <!-- ============================================================
     TOOLBAR
     ============================================================ -->
  <div id="toolbar">
    <input id="search-inv" placeholder="🔍  Buscar producto, código o categoría..." />
    <select id="filter-cat" class="filter-sel">
      <option value="">Todas las categorías</option>
    </select>
    <select id="filter-estado" class="filter-sel">
      <option value="">Todos los estados</option>
      <option value="ok">Stock OK</option>
      <option value="low">Stock bajo</option>
      <option value="critical">Stock crítico</option>
      <option value="expiring">Próximo a vencer</option>
    </select>
    <button id="btn-add-prod" onclick="openModal()">+ AGREGAR PRODUCTO</button>
  </div>

  <!-- ============================================================
     KPI ROW
     ============================================================ -->
  <div id="kpi-row">
    <div class="kpi-card ok">
      <div class="kpi-label">TOTAL PRODUCTOS</div>
      <div class="kpi-val" id="kpi-total">—</div>
      <div class="kpi-sub">en catálogo</div>
    </div>
    <div class="kpi-card warn">
      <div class="kpi-label">STOCK BAJO</div>
      <div class="kpi-val" id="kpi-low">—</div>
      <div class="kpi-sub">bajo mínimo</div>
    </div>
    <div class="kpi-card danger">
      <div class="kpi-label">STOCK CRÍTICO</div>
      <div class="kpi-val" id="kpi-crit">—</div>
      <div class="kpi-sub">≤ 5 unidades</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">VALOR INVENTARIO</div>
      <div class="kpi-val" id="kpi-val" style="font-size:15px">—</div>
      <div class="kpi-sub">costo total</div>
    </div>
  </div>

  <!-- ============================================================
     TABLA
     ============================================================ -->
  <div id="table-wrap">
    <table>
      <thead>
        <tr>
          <th></th><!-- icono -->
          <th onclick="sortBy('name')">PRODUCTO <span class="sort-icon">↕</span></th>
          <th onclick="sortBy('code')">CÓDIGO <span class="sort-icon">↕</span></th>
          <th onclick="sortBy('cat')">CATEGORÍA <span class="sort-icon">↕</span></th>
          <th onclick="sortBy('price')">PRECIO VENTA <span class="sort-icon">↕</span></th>
          <th onclick="sortBy('cost')">COSTO <span class="sort-icon">↕</span></th>
          <th onclick="sortBy('margin')">MARGEN <span class="sort-icon">↕</span></th>
          <th onclick="sortBy('stock')">STOCK <span class="sort-icon">↕</span></th>
          <th>MÍNIMO</th>
          <th>VENCIMIENTO</th>
          <th>ESTADO</th>
          <th>ACCIONES</th>
        </tr>
      </thead>
      <tbody id="inv-body"></tbody>
    </table>
  </div>

  <!-- ============================================================
     MODAL — AGREGAR / EDITAR PRODUCTO
     ============================================================ -->
  <div id="modal-overlay">
    <div id="modal">
      <h2 id="modal-title">AGREGAR PRODUCTO</h2>
      <div class="form-grid">
        <div class="form-group full">
          <label class="form-label">NOMBRE DEL PRODUCTO</label>
          <input class="form-input" id="f-name" placeholder="Ej: Leche Entera 1L" />
        </div>
        <div class="form-group">
          <label class="form-label">CÓDIGO DE BARRAS</label>
          <input class="form-input" id="f-code" placeholder="Ej: 7801005001" />
        </div>
        <div class="form-group">
          <label class="form-label">CATEGORÍA</label>
          <select class="form-input" id="f-cat">
            <option>Lácteos</option>
            <option>Panadería</option>
            <option>Frutas</option>
            <option>Verduras</option>
            <option>Carnes</option>
            <option>Bebidas</option>
            <option>Abarrotes</option>
            <option>Limpieza</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">PRECIO VENTA ($)</label>
          <input class="form-input" id="f-price" type="number" placeholder="0" />
        </div>
        <div class="form-group">
          <label class="form-label">COSTO ($)</label>
          <input class="form-input" id="f-cost" type="number" placeholder="0" />
        </div>
        <div class="form-group">
          <label class="form-label">STOCK ACTUAL</label>
          <input class="form-input" id="f-stock" type="number" placeholder="0" />
        </div>
        <div class="form-group">
          <label class="form-label">STOCK MÍNIMO</label>
          <input class="form-input" id="f-min" type="number" placeholder="0" />
        </div>
        <div class="form-group">
          <label class="form-label">FECHA VENCIMIENTO</label>
          <input class="form-input" id="f-exp" type="date" />
        </div>
        <div class="form-group">
          <label class="form-label">ÍCONO (emoji)</label>
          <input class="form-input" id="f-icon" placeholder="🥛" maxlength="4" />
        </div>
      </div>
      <div class="modal-actions">
        <button class="modal-btn-cancel" onclick="closeModal()">CANCELAR</button>
        <button class="modal-btn-save" onclick="saveProduct()">GUARDAR</button>
      </div>
    </div>
  </div>

  <!-- ============================================================
     MODAL — REPONER STOCK
     ============================================================ -->
  <div id="modal-stock-overlay">
    <div id="modal-stock">
      <h2>ENTRADA DE STOCK</h2>
      <div class="stock-product-info" id="restock-info"></div>
      <div class="form-group" style="margin-bottom:12px">
        <label class="form-label">CANTIDAD A INGRESAR</label>
        <input class="form-input" id="f-restock-qty" type="number" min="1" placeholder="0" />
      </div>
      <div class="form-group" style="margin-bottom:12px">
        <label class="form-label">PROVEEDOR</label>
        <select class="form-input" id="f-restock-prov">
          <option>Lácteos del Sur Ltda.</option>
          <option>Distribuidora Cereal S.A.</option>
          <option>Frutería Andina</option>
          <option>Carnes Premium SpA</option>
          <option>Bebidas Chile S.A.</option>
          <option>Otro</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom:16px">
        <label class="form-label">NOTA (opcional)</label>
        <input class="form-input" id="f-restock-note" placeholder="Número de guía, lote, etc." />
      </div>
      <div class="modal-actions">
        <button class="modal-btn-cancel" onclick="closeStockModal()">CANCELAR</button>
        <button class="modal-btn-save" style="background:#43d882;color:#0d0d1a"
          onclick="confirmRestock()">INGRESAR</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    /* ============================================================

       ============================================================ */
    let inventory = [

      { id: '7801009001', name: 'Manzana Royal Gala kg', cat: 'Frutas', icon: '🍎', price: 1490, cost: 900, stock: 60, minStock: 20, expiry: '2025-07-20' },
      { id: '7801009002', name: 'Plátano kg', cat: 'Frutas', icon: '🍌', price: 890, cost: 500, stock: 40, minStock: 15, expiry: '2025-07-12' },
      { id: '7801009003', name: 'Tomate kg', cat: 'Verduras', icon: '🍅', price: 1190, cost: 700, stock: 50, minStock: 20, expiry: '2025-07-15' },
      { id: '7801009004', name: 'Zanahoria kg', cat: 'Verduras', icon: '🥕', price: 690, cost: 380, stock: 35, minStock: 15, expiry: '2025-07-25' },
      { id: '7801009005', name: 'Lechuga un.', cat: 'Verduras', icon: '🥬', price: 990, cost: 500, stock: 4, minStock: 10, expiry: '2025-07-08' },
      { id: '7801011001', name: 'Pechuga Pollo kg', cat: 'Carnes', icon: '🍗', price: 5990, cost: 3800, stock: 18, minStock: 8, expiry: '2025-07-07' },
      { id: '7801011002', name: 'Carne Molida kg', cat: 'Carnes', icon: '🥩', price: 6990, cost: 4500, stock: 2, minStock: 8, expiry: '2025-07-06' },
      { id: '7801013001', name: 'Coca-Cola 1.5L', cat: 'Bebidas', icon: '🥤', price: 1490, cost: 850, stock: 55, minStock: 25, expiry: '2026-03-10' },
      { id: '7801013002', name: 'Agua Mineral 1.5L', cat: 'Bebidas', icon: '💧', price: 590, cost: 280, stock: 80, minStock: 30, expiry: '2026-06-01' },
      { id: '7801013003', name: 'Jugo Natural 1L', cat: 'Bebidas', icon: '🧃', price: 1790, cost: 1100, stock: 25, minStock: 12, expiry: '2025-08-20' },
      { id: '7801015001', name: 'Arroz Grado 1 1kg', cat: 'Abarrotes', icon: '🍚', price: 1390, cost: 850, stock: 40, minStock: 20, expiry: '2026-01-01' },
      { id: '7801015002', name: 'Fideos Spaghetti 400g', cat: 'Abarrotes', icon: '🍝', price: 990, cost: 580, stock: 38, minStock: 15, expiry: '2026-02-01' },
      { id: '7801015003', name: 'Aceite Vegetal 900ml', cat: 'Abarrotes', icon: '🫙', price: 2490, cost: 1600, stock: 28, minStock: 12, expiry: '2026-04-01' },
      { id: '7801017001', name: 'Detergente 1kg', cat: 'Limpieza', icon: '🧴', price: 3490, cost: 2100, stock: 20, minStock: 10, expiry: null },
      { id: '7801017002', name: 'Papel Higiénico x4', cat: 'Limpieza', icon: '🧻', price: 2190, cost: 1300, stock: 45, minStock: 20, expiry: null },
    ];

    /* ============================================================
       ESTADO DE FILTROS Y ORDEN
       ============================================================ */
    let searchQ = '';
    let filterCat = '';
    let filterState = '';
    let sortKey = 'name';
    let sortDir = 1;            // 1 = ASC, -1 = DESC
    let editingId = null;      // null = creando, string = editando
    let restockId = null;      // producto en reposición

    /* ============================================================
       UTILIDADES
       ============================================================ */
    const fmt = n => '$' + Math.round(n).toLocaleString('es-CL');

    /* Calcula el estado de stock de un producto */
    function getStatus(p) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      if (p.expiry) {
        const exp = new Date(p.expiry);
        const diff = Math.ceil((exp - today) / 86400000);
        if (diff <= 7 && diff >= 0) return 'expiring';
      }
      if (p.stock <= 5) return 'critical';
      if (p.stock < p.minStock) return 'low';
      return 'ok';
    }

    /* Devuelve el badge HTML para cada estado */
    function statusBadge(p) {
      const s = getStatus(p);
      const map = {
        ok: ['OK', 'badge-ok'],
        low: ['BAJO', 'badge-low'],
        critical: ['CRÍTICO', 'badge-critical'],
        expiring: ['X VENCER', 'badge-expiring'],
      };
      return `<span class="badge ${map[s][1]}">${map[s][0]}</span>`;
    }

    /* Formatea fecha de vencimiento con color */
    function fmtExpiry(expStr) {
      if (!expStr) return '<span style="color:#3a3a5c">—</span>';
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const exp = new Date(expStr);
      const diff = Math.ceil((exp - today) / 86400000);
      const dateStr = exp.toLocaleDateString('es-CL');
      if (diff <= 0) return `<span style="color:#e94560">${dateStr} (vencido)</span>`;
      if (diff <= 7) return `<span style="color:#ce93d8">${dateStr} (${diff}d)</span>`;
      if (diff <= 30) return `<span style="color:#ffb74d">${dateStr} (${diff}d)</span>`;
      return `<span style="color:#5a6a7a">${dateStr}</span>`;
    }

    /* ============================================================
       KPIs
       ============================================================ */
    function updateKPIs() {
      const total = inventory.length;
      const low = inventory.filter(p => getStatus(p) === 'low').length;
      const crit = inventory.filter(p => getStatus(p) === 'critical').length;
      const val = inventory.reduce((a, p) => a + p.cost * p.stock, 0);

      document.getElementById('kpi-total').textContent = total;
      document.getElementById('kpi-low').textContent = low;
      document.getElementById('kpi-crit').textContent = crit;
      document.getElementById('kpi-val').textContent = fmt(val);
    }

    /* ============================================================
       RENDER TABLA
       ============================================================ */
    function renderTable() {
      const q = searchQ.toLowerCase();

      /* Filtrado */
      let rows = inventory.filter(p => {
        const matchSearch = !q || p.name.toLowerCase().includes(q) || p.id.includes(q) || p.cat.toLowerCase().includes(q);
        const matchCat = !filterCat || p.cat === filterCat;
        const matchState = !filterState || getStatus(p) === filterState;
        return matchSearch && matchCat && matchState;
      });

      /* Ordenamiento */
      rows.sort((a, b) => {
        let va = a[sortKey], vb = b[sortKey];
        if (sortKey === 'margin') { va = (a.price - a.cost) / a.price; vb = (b.price - b.cost) / b.price; }
        if (typeof va === 'string') return va.localeCompare(vb) * sortDir;
        return (va - vb) * sortDir;
      });

      /* Render */
      document.getElementById('inv-body').innerHTML = rows.map(p => {
        const margin = ((p.price - p.cost) / p.price * 100).toFixed(1);
        const marginColor = margin >= 30 ? '#43d882' : margin >= 15 ? '#ffb74d' : '#e94560';
        const status = getStatus(p);
        const rowClass = status === 'critical' ? 'critical' : status === 'low' ? 'low-stock' : status === 'expiring' ? 'expiring' : '';

        return `
    <tr class="${rowClass}">
      <td class="td-icon">${p.icon}</td>
      <td class="td-name">
        ${p.name}
        <div class="td-sub">${p.id}</div>
      </td>
      <td class="td-code">${p.id}</td>
      <td>${p.cat}</td>
      <td class="td-price">${fmt(p.price)}</td>
      <td class="td-cost">${fmt(p.cost)}</td>
      <td class="td-margin" style="color:${marginColor}">${margin}%</td>
      <td class="td-stock" style="color:${p.stock <= 5 ? '#e94560' : p.stock < p.minStock ? '#ffb74d' : '#4fc3f7'}">${p.stock}</td>
      <td class="td-min">${p.minStock}</td>
      <td class="td-expiry">${fmtExpiry(p.expiry)}</td>
      <td>${statusBadge(p)}</td>
      <td class="td-actions">
        <button class="act-btn act-reponer" onclick="openStockModal('${p.id}')">+STOCK</button>
        <button class="act-btn act-edit"    onclick="openModal('${p.id}')">EDITAR</button>
        <button class="act-btn act-del"     onclick="deleteProduct('${p.id}')">✕</button>
      </td>
    </tr>`;
      }).join('');

      updateKPIs();
    }

    /* ============================================================
       ORDENAMIENTO
       ============================================================ */
    function sortBy(key) {
      if (sortKey === key) sortDir *= -1;
      else { sortKey = key; sortDir = 1; }

      /* Marca visualmente la columna activa */
      document.querySelectorAll('thead th').forEach(th => {
        th.classList.toggle('sorted', th.textContent.trim().startsWith(key.toUpperCase().substring(0, 4)));
      });
      renderTable();
    }

    /* ============================================================
       CATEGORÍAS → select
       ============================================================ */
    function populateCatFilter() {
      const cats = [...new Set(inventory.map(p => p.cat))].sort();
      const sel = document.getElementById('filter-cat');
      sel.innerHTML = '<option value="">Todas las categorías</option>' +
        cats.map(c => `<option>${c}</option>`).join('');
    }

    /* ============================================================
       MODAL — PRODUCTO
       ============================================================ */
    function openModal(id = null) {
      editingId = id;
      const p = id ? inventory.find(x => x.id === id) : null;
      document.getElementById('modal-title').textContent = p ? 'EDITAR PRODUCTO' : 'AGREGAR PRODUCTO';

      /* Pre-carga de campos si es edición */
      document.getElementById('f-name').value = p?.name ?? '';
      document.getElementById('f-code').value = p?.id ?? '';
      document.getElementById('f-cat').value = p?.cat ?? 'Lácteos';
      document.getElementById('f-price').value = p?.price ?? '';
      document.getElementById('f-cost').value = p?.cost ?? '';
      document.getElementById('f-stock').value = p?.stock ?? '';
      document.getElementById('f-min').value = p?.minStock ?? '';
      document.getElementById('f-exp').value = p?.expiry ?? '';
      document.getElementById('f-icon').value = p?.icon ?? '📦';

      document.getElementById('modal-overlay').classList.add('show');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('show');
      editingId = null;
    }

    function saveProduct() {
      const name = document.getElementById('f-name').value.trim();
      const code = document.getElementById('f-code').value.trim();
      if (!name || !code) { showToast('Nombre y código son obligatorios', 'error'); return; }

      const product = {
        id: code,
        name,
        cat: document.getElementById('f-cat').value,
        icon: document.getElementById('f-icon').value || '📦',
        price: parseInt(document.getElementById('f-price').value) || 0,
        cost: parseInt(document.getElementById('f-cost').value) || 0,
        stock: parseInt(document.getElementById('f-stock').value) || 0,
        minStock: parseInt(document.getElementById('f-min').value) || 0,
        expiry: document.getElementById('f-exp').value || null,
      };

      if (editingId) {
        /* Editar existente */
        const idx = inventory.findIndex(x => x.id === editingId);
        inventory[idx] = product;
        showToast('Producto actualizado', 'ok');
      } else {
        /* Crear nuevo — verificar código duplicado */
        if (inventory.find(x => x.id === code)) { showToast('Código ya existe', 'error'); return; }
        inventory.push(product);
        showToast('Producto agregado', 'ok');
      }

      closeModal();
      populateCatFilter();
      renderTable();

      /* TODO: POST /api/inventario con el objeto product */
    }

    function deleteProduct(id) {
      if (!confirm('¿Eliminar este producto del inventario?')) return;
      inventory = inventory.filter(x => x.id !== id);
      renderTable();
      showToast('Producto eliminado');

      /* TODO: DELETE /api/inventario/:id */
    }

    /* ============================================================
       MODAL — REPOSICIÓN DE STOCK
       ============================================================ */
    function openStockModal(id) {
      restockId = id;
      const p = inventory.find(x => x.id === id);
      document.getElementById('restock-info').innerHTML =
        `<strong>${p.icon} ${p.name}</strong><br>Stock actual: <strong style="color:#4fc3f7">${p.stock}</strong> &nbsp;|&nbsp; Mínimo: ${p.minStock}`;
      document.getElementById('f-restock-qty').value = '';
      document.getElementById('f-restock-note').value = '';
      document.getElementById('modal-stock-overlay').classList.add('show');
    }

    function closeStockModal() {
      document.getElementById('modal-stock-overlay').classList.remove('show');
      restockId = null;
    }

    function confirmRestock() {
      const qty = parseInt(document.getElementById('f-restock-qty').value) || 0;
      if (qty <= 0) { showToast('Ingresa una cantidad válida', 'error'); return; }
      const p = inventory.find(x => x.id === restockId);
      p.stock += qty;
      closeStockModal();
      renderTable();
      showToast(`+${qty} unidades ingresadas para ${p.name}`, 'ok');

      /* TODO: POST /api/inventario/:id/entrada  { qty, proveedor, nota } */
    }

    /* ============================================================
       TOAST
       ============================================================ */
    function showToast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = type;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 2000);
    }

    /* ============================================================
       EVENTOS
       ============================================================ */
    document.getElementById('search-inv').addEventListener('input', function () {
      searchQ = this.value; renderTable();
    });
    document.getElementById('filter-cat').addEventListener('change', function () {
      filterCat = this.value; renderTable();
    });
    document.getElementById('filter-estado').addEventListener('change', function () {
      filterState = this.value; renderTable();
    });

    /* Reloj */
    function updateClock() {
      document.getElementById('top-clock').textContent = new Date().toLocaleTimeString('es-CL');
    }

    /* ============================================================
       INIT
       ============================================================ */
    populateCatFilter();
    renderTable();
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>

</html>
