<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRESHMART — Turnos y Cajas</title>
  <style>
    /* ============================================================
   BASE — misma paleta que el módulo de Ventas
   ============================================================ */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Courier New', monospace;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ============================================================
   HEADER
   ============================================================ */
    #top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: #16213e;
      border-bottom: 2px solid #0f3460;
      flex-shrink: 0;
    }

    #top-bar h1 {
      font-size: 15px;
      color: #e94560;
      letter-spacing: 2px;
      font-weight: 700;
    }

    #top-clock {
      font-size: 13px;
      color: #a0a0b0;
    }

    #top-user {
      font-size: 12px;
      color: #4fc3f7;
    }

    /* ============================================================
   LAYOUT — izquierda (cajas activas) | derecha (historial)
   ============================================================ -->
   ============================================================ */
    #main-layout {
      display: grid;
      grid-template-columns: 1fr 400px;
      flex: 1;
      overflow: hidden;
    }

    /* ============================================================
   PANEL IZQUIERDO — cajas activas
   ============================================================ */
    #left-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 2px solid #0f3460;
    }

    #left-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: #0d0d1a;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
    }

    #left-header span {
      font-size: 10px;
      color: #5a6a7a;
      letter-spacing: 1px;
    }

    .header-btn {
      padding: 6px 14px;
      border: none;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      letter-spacing: 1px;
    }

    .btn-red {
      background: #e94560;
      color: white;
    }

    .btn-red:hover {
      background: #c73652;
    }

    .btn-green {
      background: #43d882;
      color: #0d0d1a;
    }

    .btn-green:hover {
      background: #2ab864;
    }

    .btn-blue {
      background: none;
      border: 1px solid #4fc3f7;
      color: #4fc3f7;
    }

    .btn-blue:hover {
      background: #4fc3f7;
      color: #0d0d1a;
    }

    /* KPI fila */
    #kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 10px 14px;
      flex-shrink: 0;
    }

    .kpi-sm {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 8px 10px;
    }

    .kpi-sm .kpi-lbl {
      font-size: 9px;
      color: #5a6a7a;
      letter-spacing: 1px;
    }

    .kpi-sm .kpi-v {
      font-size: 17px;
      font-weight: 700;
      color: #4fc3f7;
    }

    .kpi-sm .kpi-sub {
      font-size: 9px;
      color: #3a3a5c;
    }

    /* Lista de cajas */
    #cajas-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #cajas-list::-webkit-scrollbar {
      width: 4px;
    }

    #cajas-list::-webkit-scrollbar-thumb {
      background: #0f3460;
      border-radius: 4px;
    }

    /* Tarjeta de caja */
    .caja-card {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 12px;
      padding: 14px;
    }

    .caja-card.open {
      border-left: 4px solid #43d882;
    }

    .caja-card.closed {
      border-left: 4px solid #3a3a5c;
      opacity: 0.7;
    }

    .caja-card.diff {
      border-left: 4px solid #e94560;
    }

    .caja-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .caja-name {
      font-size: 14px;
      font-weight: 700;
      color: #e0e8f0;
    }

    .caja-cajero {
      font-size: 11px;
      color: #4fc3f7;
    }

    .caja-hora {
      font-size: 10px;
      color: #5a6a7a;
    }

    .status-badge {
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .sb-open {
      background: #1a3a2a;
      color: #43d882;
      border: 1px solid #2a5a3a;
    }

    .sb-closed {
      background: #1a1a2a;
      color: #5a6a7a;
      border: 1px solid #2a2a3a;
    }

    .sb-diff {
      background: #3a1a1a;
      color: #e94560;
      border: 1px solid #5a2a2a;
    }

    /* Métricas de caja */
    .caja-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .metric-item {}

    .metric-lbl {
      font-size: 9px;
      color: #5a6a7a;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .metric-val {
      font-size: 13px;
      font-weight: 700;
      color: #c0d0e0;
    }

    .metric-val.blue {
      color: #4fc3f7;
    }

    .metric-val.green {
      color: #43d882;
    }

    .metric-val.red {
      color: #e94560;
    }

    .metric-val.amber {
      color: #ffb74d;
    }

    /* Diferencia de caja destacada */
    .diff-alert {
      background: #2a0a0a;
      border: 1px solid #5a2a2a;
      border-radius: 6px;
      padding: 6px 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .diff-alert span {
      font-size: 11px;
      color: #e94560;
    }

    /* Progreso de turno */
    .turno-progress {
      margin-bottom: 10px;
    }

    .progress-bar-wrap {
      height: 4px;
      background: #0d0d1a;
      border-radius: 2px;
      margin-top: 4px;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 2px;
      background: #4fc3f7;
    }

    /* Acciones de caja */
    .caja-actions {
      display: flex;
      gap: 6px;
    }

    .caja-btn {
      flex: 1;
      padding: 6px 0;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
      font-family: 'Courier New', monospace;
      transition: all 0.15s;
    }

    /* ============================================================
   PANEL DERECHO — historial de turnos
   ============================================================ */
    #right-panel {
      display: flex;
      flex-direction: column;
      background: #0d0d1a;
      overflow: hidden;
    }

    #right-header {
      padding: 10px 14px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #right-header span {
      font-size: 10px;
      color: #5a6a7a;
      letter-spacing: 1px;
    }

    .right-filter {
      display: flex;
      gap: 6px;
      padding: 8px 14px;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .rf-btn {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 10px;
      cursor: pointer;
      border: 1px solid #0f3460;
      background: #16213e;
      color: #5a6a7a;
      font-family: 'Courier New', monospace;
    }

    .rf-btn:hover,
    .rf-btn.active {
      border-color: #4fc3f7;
      color: #4fc3f7;
      background: #0a1628;
    }

    #hist-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #hist-list::-webkit-scrollbar {
      width: 4px;
    }

    #hist-list::-webkit-scrollbar-thumb {
      background: #0f3460;
      border-radius: 4px;
    }

    /* Ítem de historial */
    .hist-item {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 10px 12px;
    }

    .hist-item.has-diff {
      border-left: 3px solid #e94560;
    }

    .hist-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .hist-caja {
      font-size: 12px;
      font-weight: 700;
      color: #e0e0e0;
    }

    .hist-cajero {
      font-size: 11px;
      color: #4fc3f7;
    }

    .hist-fecha {
      font-size: 10px;
      color: #5a6a7a;
    }

    .hist-row {
      display: flex;
      gap: 14px;
      font-size: 11px;
    }

    .hist-stat .hl {
      font-size: 9px;
      color: #5a6a7a;
    }

    .hist-stat .hv {
      color: #c0d0e0;
    }

    .hist-stat .hv.green {
      color: #43d882;
    }

    .hist-stat .hv.red {
      color: #e94560;
    }

    .hist-stat .hv.blue {
      color: #4fc3f7;
    }

    /* ============================================================
   MODALES
   ============================================================ */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-box {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 12px;
      padding: 24px;
      width: 420px;
      max-width: 95vw;
    }

    .modal-box h2 {
      font-size: 13px;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }

    .form-label {
      font-size: 9px;
      color: #5a6a7a;
      letter-spacing: 1px;
    }

    .form-input {
      padding: 8px 10px;
      background: #0d0d1a;
      border: 1px solid #0f3460;
      border-radius: 6px;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      outline: none;
    }

    .form-input:focus {
      border-color: #4fc3f7;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      justify-content: flex-end;
    }

    .modal-btn-cancel {
      padding: 7px 14px;
      background: none;
      border: 1px solid #0f3460;
      border-radius: 6px;
      color: #a0b0c0;
      cursor: pointer;
      font-size: 11px;
      font-family: 'Courier New', monospace;
    }

    .modal-btn-ok {
      padding: 7px 18px;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      font-family: 'Courier New', monospace;
    }

    /* Resumen de cierre de caja */
    .cierre-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #0f3460;
      font-size: 12px;
    }

    .cierre-row:last-child {
      border: none;
    }

    .cierre-row .lbl {
      color: #7a8a9a;
    }

    .cierre-row .val {
      font-weight: 700;
    }

    /* ============================================================
   TOAST
   ============================================================ */
    #toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: #4fc3f7;
      color: #0d0d1a;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      display: none;
      z-index: 300;
    }

    #toast.error {
      background: #e94560;
      color: white;
    }

    #toast.ok {
      background: #43d882;
      color: #0d0d1a;
    }

    #toast.warn {
      background: #ffb74d;
      color: #0d0d1a;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div id="top-bar">
    <h1>FRESHMART — TURNOS Y CAJAS</h1>
    <div style="text-align:right">
      <div id="top-clock"></div>
      <div id="top-user">Admin: María G.</div>
    </div>
  </div>

  <!-- LAYOUT -->
  <div id="main-layout">

    <!-- ===== PANEL IZQUIERDO ===== -->
    <div id="left-panel">

      <div id="left-header">
        <span>CAJAS DEL DÍA</span>
        <button class="header-btn btn-green" onclick="openAperturaModal()">+ ABRIR CAJA</button>
      </div>

      <div id="kpi-row">
        <div class="kpi-sm">
          <div class="kpi-lbl">CAJAS ACTIVAS</div>
          <div class="kpi-v" id="kpi-activas">—</div>
          <div class="kpi-sub">en turno</div>
        </div>
        <div class="kpi-sm">
          <div class="kpi-lbl">VENTAS TOTALES</div>
          <div class="kpi-v" id="kpi-ventas" style="font-size:13px">—</div>
          <div class="kpi-sub">todas las cajas</div>
        </div>
        <div class="kpi-sm">
          <div class="kpi-lbl">TRANSACCIONES</div>
          <div class="kpi-v" id="kpi-trx">—</div>
          <div class="kpi-sub">hoy</div>
        </div>
        <div class="kpi-sm" style="border-color:#e94560">
          <div class="kpi-lbl" style="color:#e94560">DIFERENCIAS</div>
          <div class="kpi-v" id="kpi-diff" style="color:#e94560">—</div>
          <div class="kpi-sub">cajas con diff.</div>
        </div>
      </div>

      <div id="cajas-list"></div>
    </div>

    <!-- ===== PANEL DERECHO ===== -->
    <div id="right-panel">
      <div id="right-header">
        <span>HISTORIAL DE TURNOS</span>
        <button class="header-btn btn-blue" style="font-size:10px;padding:4px 10px" onclick="renderHistorial()">↻
          ACTUALIZAR</button>
      </div>

      <div class="right-filter">
        <button class="rf-btn active" onclick="setHistFilter('todos',this)">TODOS</button>
        <button class="rf-btn" onclick="setHistFilter('diff',this)">CON DIFERENCIA</button>
        <button class="rf-btn" onclick="setHistFilter('cerrados',this)">CERRADOS</button>
      </div>

      <div id="hist-list"></div>
    </div>
  </div>

  <!-- ============================================================
     MODAL — APERTURA DE CAJA
     ============================================================ -->
  <div class="modal-overlay" id="modal-apertura">
    <div class="modal-box">
      <h2 style="color:#43d882">APERTURA DE CAJA</h2>
      <div class="form-group">
        <label class="form-label">NÚMERO DE CAJA</label>
        <select class="form-input" id="ap-caja">
          <option value="1">Caja 1</option>
          <option value="2">Caja 2</option>
          <option value="3">Caja 3</option>
          <option value="4">Caja 4</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">CAJERO RESPONSABLE</label>
        <select class="form-input" id="ap-cajero">
          <option>Juan P.</option>
          <option>Ana R.</option>
          <option>Luis M.</option>
          <option>Carmen V.</option>
          <option>Pedro A.</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">MONTO INICIAL EN CAJA ($)</label>
        <input class="form-input" id="ap-monto" type="number" placeholder="50000" />
      </div>
      <div class="form-group">
        <label class="form-label">NOTA (opcional)</label>
        <input class="form-input" id="ap-nota" placeholder="Turno mañana, reemplazo, etc." />
      </div>
      <div class="modal-actions">
        <button class="modal-btn-cancel" onclick="closeModal('modal-apertura')">CANCELAR</button>
        <button class="modal-btn-ok btn-green" onclick="abrirCaja()">ABRIR TURNO</button>
      </div>
    </div>
  </div>

  <!-- ============================================================
     MODAL — CIERRE DE CAJA
     ============================================================ -->
  <div class="modal-overlay" id="modal-cierre">
    <div class="modal-box">
      <h2 style="color:#e94560">CIERRE DE CAJA</h2>
      <div id="cierre-resumen" style="margin-bottom:14px"></div>
      <div class="form-group">
        <label class="form-label">EFECTIVO CONTADO EN CAJA ($)</label>
        <input class="form-input" id="ci-contado" type="number" placeholder="0" oninput="calcDiferencia()" />
      </div>
      <div id="ci-diff-display"
        style="display:none;padding:8px 12px;border-radius:6px;margin-bottom:10px;font-size:12px"></div>
      <div class="form-group">
        <label class="form-label">OBSERVACIÓN</label>
        <input class="form-input" id="ci-obs" placeholder="Detallar si hay diferencia..." />
      </div>
      <div class="modal-actions">
        <button class="modal-btn-cancel" onclick="closeModal('modal-cierre')">CANCELAR</button>
        <button class="modal-btn-ok btn-red" onclick="cerrarCaja()">CERRAR TURNO</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    /* ============================================================
       DATOS DE EJEMPLO
       TODO: reemplazar con fetch('/api/turnos') al conectar backend
       ============================================================ */

    /* Estado actual de cajas */
    let cajas = [
      {
        id: 1, nombre: 'Caja 1', estado: 'open',
        cajero: 'Juan P.', horaApertura: '08:02',
        montoInicial: 50000, ventasSistema: 182400, ventasEfectivo: 94900, ventasCard: 72300, ventasTransfer: 15200,
        transacciones: 32, descuentos: 8400, nota: '',
        turnoMins: 480, // duración del turno en minutos
      },
      {
        id: 2, nombre: 'Caja 2', estado: 'diff',
        cajero: 'Ana R.', horaApertura: '08:15',
        montoInicial: 50000, ventasSistema: 143800, ventasEfectivo: 72100, ventasCard: 55800, ventasTransfer: 15900,
        transacciones: 26, descuentos: 6100, nota: '',
        turnoMins: 420,
        montoContado: 65400, // efectivo contado al cierre
      },
      {
        id: 3, nombre: 'Caja 3', estado: 'closed',
        cajero: 'Luis M.', horaApertura: '14:00', horaCierre: '20:00',
        montoInicial: 50000, ventasSistema: 89200, ventasEfectivo: 44600, ventasCard: 32100, ventasTransfer: 12500,
        transacciones: 19, descuentos: 3200, nota: 'Turno tarde sin incidencias.',
        turnoMins: 360,
      },
    ];

    /* Historial de turnos anteriores (hoy y ayer) */
    let historial = [
      { id: 'T-041', caja: 'Caja 1', cajero: 'Juan P.', fecha: '04/07 08:02–14:05', ventas: 162400, trx: 29, diff: 0, obs: '' },
      { id: 'T-040', caja: 'Caja 2', cajero: 'Carmen V.', fecha: '04/07 08:15–14:15', ventas: 134700, trx: 24, diff: -2300, obs: 'Faltaron $2.300 al cierre.' },
      { id: 'T-039', caja: 'Caja 3', cajero: 'Pedro A.', fecha: '04/07 14:00–20:00', ventas: 98400, trx: 21, diff: 500, obs: 'Sobraron $500.' },
      { id: 'T-038', caja: 'Caja 1', cajero: 'Ana R.', fecha: '03/07 08:00–14:00', ventas: 189200, trx: 35, diff: 0, obs: '' },
      { id: 'T-037', caja: 'Caja 2', cajero: 'Luis M.', fecha: '03/07 08:10–14:10', ventas: 142100, trx: 26, diff: -1500, obs: 'Diferencia no explicada.' },
      { id: 'T-036', caja: 'Caja 3', cajero: 'Juan P.', fecha: '03/07 14:00–20:05', ventas: 88300, trx: 17, diff: 0, obs: '' },
      { id: 'T-035', caja: 'Caja 1', cajero: 'Pedro A.', fecha: '02/07 08:05–14:00', ventas: 176500, trx: 31, diff: 800, obs: 'Sobrante por redondeo.' },
    ];

    /* ============================================================
       ESTADO
       ============================================================ */
    let histFilter = 'todos';
    let cierreId = null; // ID de caja a cerrar

    /* ============================================================
       UTILIDADES
       ============================================================ */
    const fmt = n => '$' + Math.round(n).toLocaleString('es-CL');

    function turnoActivo(c) {
      const now = new Date();
      const [h, m] = c.horaApertura.split(':').map(Number);
      const open = new Date(); open.setHours(h, m, 0, 0);
      const diffMin = Math.round((now - open) / 60000);
      return diffMin;
    }

    function pctTurno(minutos) {
      /* Asume turno de 6h = 360 min */
      return Math.min(100, Math.round(minutos / 360 * 100));
    }

    /* ============================================================
       KPIs
       ============================================================ */
    function updateKPIs() {
      const activas = cajas.filter(c => c.estado !== 'closed').length;
      const totalV = cajas.reduce((a, c) => a + c.ventasSistema, 0);
      const totalTrx = cajas.reduce((a, c) => a + c.transacciones, 0);
      const diffs = cajas.filter(c => c.estado === 'diff').length;

      document.getElementById('kpi-activas').textContent = activas;
      document.getElementById('kpi-ventas').textContent = fmt(totalV);
      document.getElementById('kpi-trx').textContent = totalTrx;
      document.getElementById('kpi-diff').textContent = diffs;
    }

    /* ============================================================
       RENDER CAJAS
       ============================================================ */
    function renderCajas() {
      document.getElementById('cajas-list').innerHTML = cajas.map(c => {
        const isOpen = c.estado === 'open';
        const isDiff = c.estado === 'diff';
        const isClosed = c.estado === 'closed';

        /* Diferencia de efectivo (solo si hay montoContado) */
        const efectivoEsperado = c.montoInicial + c.ventasEfectivo;
        const diff = c.montoContado !== undefined
          ? c.montoContado - efectivoEsperado : null;

        /* Minutos de turno activo */
        const mins = isOpen || isDiff ? turnoActivo(c) : c.turnoMins;
        const pct = pctTurno(mins);
        const horas = Math.floor(mins / 60), minRest = mins % 60;

        return `
    <div class="caja-card ${c.estado}">
      <div class="caja-top">
        <div>
          <div class="caja-name">${c.nombre}</div>
          <div class="caja-cajero">👤 ${c.cajero}</div>
          <div class="caja-hora">⏰ Apertura: ${c.horaApertura}${c.horaCierre ? ' — Cierre: ' + c.horaCierre : ''}</div>
        </div>
        <span class="status-badge ${isDiff ? 'sb-diff' : isOpen ? 'sb-open' : 'sb-closed'}">
          ${isDiff ? '⚠ DIFERENCIA' : isOpen ? '● ABIERTA' : '✓ CERRADA'}
        </span>
      </div>

      <div class="caja-metrics">
        <div class="metric-item">
          <div class="metric-lbl">VENTAS SISTEMA</div>
          <div class="metric-val blue">${fmt(c.ventasSistema)}</div>
        </div>
        <div class="metric-item">
          <div class="metric-lbl">TRANSACCIONES</div>
          <div class="metric-val">${c.transacciones}</div>
        </div>
        <div class="metric-item">
          <div class="metric-lbl">TICKET PROM.</div>
          <div class="metric-val">${fmt(Math.round(c.ventasSistema / (c.transacciones || 1)))}</div>
        </div>
        <div class="metric-item">
          <div class="metric-lbl">EFECTIVO</div>
          <div class="metric-val green">${fmt(c.ventasEfectivo)}</div>
        </div>
        <div class="metric-item">
          <div class="metric-lbl">TARJETA</div>
          <div class="metric-val" style="color:#4fc3f7">${fmt(c.ventasCard)}</div>
        </div>
        <div class="metric-item">
          <div class="metric-lbl">MONTO INICIAL</div>
          <div class="metric-val">${fmt(c.montoInicial)}</div>
        </div>
      </div>

      ${isDiff && diff !== null ? `
      <div class="diff-alert">
        <span>⚠ Diferencia detectada al cierre</span>
        <span style="font-weight:700">${diff >= 0 ? '+' : ''}${fmt(diff)}</span>
      </div>` : ''}

      ${isOpen ? `
      <div class="turno-progress">
        <div style="display:flex;justify-content:space-between;font-size:9px;color:#5a6a7a;margin-bottom:3px">
          <span>DURACIÓN DEL TURNO</span>
          <span>${horas}h ${minRest}m</span>
        </div>
        <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      </div>` : ''}

      <div class="caja-actions">
        ${isOpen ? `
          <button class="caja-btn btn-red" onclick="openCierreModal(${c.id})">CERRAR TURNO</button>
          <button class="caja-btn btn-blue" onclick="verDetalle(${c.id})" style="flex:0.5">DETALLE</button>
        ` : isDiff ? `
          <button class="caja-btn btn-red" onclick="aceptarDiff(${c.id})" style="font-size:10px">ACEPTAR DIFF</button>
          <button class="caja-btn btn-blue" onclick="verDetalle(${c.id})" style="flex:0.5">DETALLE</button>
        ` : `
          <button class="caja-btn btn-blue" onclick="verDetalle(${c.id})">VER DETALLE</button>
        `}
      </div>
    </div>`;
      }).join('');

      updateKPIs();
    }

    /* ============================================================
       RENDER HISTORIAL
       ============================================================ */
    function renderHistorial() {
      let list = [...historial];
      if (histFilter === 'diff') list = list.filter(t => t.diff !== 0);
      if (histFilter === 'cerrados') list = list; // todos son cerrados en historial

      document.getElementById('hist-list').innerHTML = list.map(t => {
        const hasDiff = t.diff !== 0;
        const diffColor = t.diff > 0 ? 'green' : 'red';
        const diffSign = t.diff > 0 ? '+' : '';
        return `
    <div class="hist-item ${hasDiff ? 'has-diff' : ''}">
      <div class="hist-top">
        <div>
          <span class="hist-caja">${t.caja}</span>
          <span class="hist-cajero" style="margin-left:8px">${t.cajero}</span>
        </div>
        <span class="hist-fecha">${t.fecha}</span>
      </div>
      <div class="hist-row">
        <div class="hist-stat">
          <div class="hl">VENTAS</div>
          <div class="hv blue">${fmt(t.ventas)}</div>
        </div>
        <div class="hist-stat">
          <div class="hl">TRX</div>
          <div class="hv">${t.trx}</div>
        </div>
        <div class="hist-stat">
          <div class="hl">DIFERENCIA</div>
          <div class="hv ${hasDiff ? diffColor : ''}">${hasDiff ? diffSign + fmt(t.diff) : 'Sin diff.'}</div>
        </div>
        ${t.obs ? `<div class="hist-stat" style="flex:1"><div class="hl">OBS</div><div class="hv" style="color:#7a8a9a;font-size:10px">${t.obs}</div></div>` : ''}
      </div>
    </div>`;
      }).join('');
    }

    function setHistFilter(f, btn) {
      histFilter = f;
      document.querySelectorAll('.rf-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderHistorial();
    }

    /* ============================================================
       MODAL — APERTURA
       ============================================================ */
    function openAperturaModal() {
      document.getElementById('ap-monto').value = '';
      document.getElementById('ap-nota').value = '';
      document.getElementById('modal-apertura').classList.add('show');
    }

    function abrirCaja() {
      const numCaja = parseInt(document.getElementById('ap-caja').value);
      const cajero = document.getElementById('ap-cajero').value;
      const monto = parseInt(document.getElementById('ap-monto').value) || 0;
      const nota = document.getElementById('ap-nota').value;

      if (cajas.find(c => c.id === numCaja && c.estado !== 'closed')) {
        showToast('Esa caja ya está activa', 'error'); return;
      }
      if (monto <= 0) { showToast('Ingresa el monto inicial', 'error'); return; }

      const now = new Date();
      const hora = now.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });

      /* Reemplaza la caja si existe, si no la crea */
      const idx = cajas.findIndex(c => c.id === numCaja);
      const newCaja = {
        id: numCaja, nombre: `Caja ${numCaja}`, estado: 'open',
        cajero, horaApertura: hora,
        montoInicial: monto, ventasSistema: 0, ventasEfectivo: 0, ventasCard: 0, ventasTransfer: 0,
        transacciones: 0, descuentos: 0, nota, turnoMins: 0,
      };
      if (idx >= 0) cajas[idx] = newCaja;
      else cajas.push(newCaja);

      closeModal('modal-apertura');
      renderCajas();
      showToast(`Caja ${numCaja} abierta por ${cajero}`, 'ok');

      /* TODO: POST /api/turnos/apertura */
    }

    /* ============================================================
       MODAL — CIERRE
       ============================================================ */
    function openCierreModal(cajaId) {
      cierreId = cajaId;
      const c = cajas.find(x => x.id === cajaId);
      const efectivoEsperado = c.montoInicial + c.ventasEfectivo;

      document.getElementById('cierre-resumen').innerHTML = `
    <div class="cierre-row"><span class="lbl">Caja</span><span class="val">${c.nombre} — ${c.cajero}</span></div>
    <div class="cierre-row"><span class="lbl">Apertura</span><span class="val">${c.horaApertura}</span></div>
    <div class="cierre-row"><span class="lbl">Ventas sistema</span><span class="val" style="color:#4fc3f7">${fmt(c.ventasSistema)}</span></div>
    <div class="cierre-row"><span class="lbl">Ventas efectivo</span><span class="val" style="color:#43d882">${fmt(c.ventasEfectivo)}</span></div>
    <div class="cierre-row"><span class="lbl">Monto inicial</span><span class="val">${fmt(c.montoInicial)}</span></div>
    <div class="cierre-row"><span class="lbl">Efectivo esperado</span><span class="val" style="color:#ffb74d">${fmt(efectivoEsperado)}</span></div>`;

      document.getElementById('ci-contado').value = '';
      document.getElementById('ci-obs').value = '';
      document.getElementById('ci-diff-display').style.display = 'none';
      document.getElementById('modal-cierre').classList.add('show');
    }

    function calcDiferencia() {
      const c = cajas.find(x => x.id === cierreId);
      const esp = c.montoInicial + c.ventasEfectivo;
      const con = parseInt(document.getElementById('ci-contado').value) || 0;
      const diff = con - esp;
      const el = document.getElementById('ci-diff-display');

      if (!con) { el.style.display = 'none'; return; }
      el.style.display = 'block';
      if (diff === 0) {
        el.style.background = '#1a3a2a'; el.style.border = '1px solid #2a5a3a';
        el.innerHTML = `<span style="color:#43d882">✓ Sin diferencia. Cuadra perfectamente.</span>`;
      } else if (diff > 0) {
        el.style.background = '#0a1628'; el.style.border = '1px solid #1a3a5a';
        el.innerHTML = `<span style="color:#4fc3f7">↑ Sobrante: ${fmt(diff)}</span>`;
      } else {
        el.style.background = '#3a1a1a'; el.style.border = '1px solid #5a2a2a';
        el.innerHTML = `<span style="color:#e94560">↓ Faltante: ${fmt(Math.abs(diff))} — Se requiere observación.</span>`;
      }
    }

    function cerrarCaja() {
      const c = cajas.find(x => x.id === cierreId);
      const esp = c.montoInicial + c.ventasEfectivo;
      const con = parseInt(document.getElementById('ci-contado').value) || 0;
      const diff = con - esp;
      const obs = document.getElementById('ci-obs').value;

      if (!con) { showToast('Ingresa el efectivo contado', 'error'); return; }
      if (diff !== 0 && !obs.trim()) { showToast('Escribe una observación para la diferencia', 'warn'); return; }

      const now = new Date();
      const hora = now.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });

      /* Mover a historial */
      historial.unshift({
        id: 'T-' + String(Math.max(...historial.map(t => parseInt(t.id.split('-')[1]))) + 1).padStart(3, '0'),
        caja: c.nombre, cajero: c.cajero,
        fecha: `${now.toLocaleDateString('es-CL')} ${c.horaApertura}–${hora}`,
        ventas: c.ventasSistema, trx: c.transacciones, diff, obs,
      });

      /* Actualizar estado */
      c.estado = diff !== 0 ? 'diff' : 'closed';
      c.horaCierre = hora;
      c.montoContado = con;

      closeModal('modal-cierre');
      renderCajas();
      renderHistorial();
      showToast(diff === 0 ? 'Caja cerrada sin diferencia' : `Caja cerrada con diferencia ${fmt(diff)}`, diff === 0 ? 'ok' : 'warn');

      /* TODO: POST /api/turnos/cierre */
    }

    function aceptarDiff(cajaId) {
      const c = cajas.find(x => x.id === cajaId);
      c.estado = 'closed';
      renderCajas();
      renderHistorial();
      showToast('Diferencia aceptada y turno cerrado');
    }

    function verDetalle(cajaId) {
      const c = cajas.find(x => x.id === cajaId);
      alert(`${c.nombre} — ${c.cajero}\nVentas: ${fmt(c.ventasSistema)}\nTransacciones: ${c.transacciones}\nEfectivo: ${fmt(c.ventasEfectivo)}\nTarjeta: ${fmt(c.ventasCard)}\nTransferencia: ${fmt(c.ventasTransfer)}`);
      /* TODO: abrir panel lateral con detalle completo */
    }

    /* ============================================================
       UTILS MODAL
       ============================================================ */
    function openAperturaModal() {
      document.getElementById('ap-monto').value = '';
      document.getElementById('ap-nota').value = '';
      document.getElementById('modal-apertura').classList.add('show');
    }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }

    /* ============================================================
       TOAST
       ============================================================ */
    function showToast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = type; t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 2200);
    }

    /* ============================================================
       RELOJ
       ============================================================ */
    function updateClock() {
      document.getElementById('top-clock').textContent = new Date().toLocaleTimeString('es-CL');
    }

    /* ============================================================
       INIT
       ============================================================ */
    renderCajas();
    renderHistorial();
    updateClock();
    setInterval(updateClock, 1000);
    /* Actualiza minutos del turno cada minuto */
    setInterval(() => { renderCajas(); }, 60000);
  </script>
</body>

</html>
